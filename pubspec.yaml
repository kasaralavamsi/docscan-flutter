name: docscan_clone
description: A Flutter document scanner MVP with multi-page scanning, filters, PDF export, and sharing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  printing: ^5.15.1
  cunning_document_scanner: ^3.0.3
  google_mlkit_text_recognition: ^0.17.1
  image_cropper: ^13.0.0
  image: ^4.12.0
  pdf: ^3.13.1
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
